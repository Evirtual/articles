<!doctype html>
<!-- The two covers for "Every solid in CSS is made of paper" (draft), drawn in the style of the other
     CSS 3D Lab covers: the lab's cube and gradient title on the left, the four models from the
     article on the right. Render with: node articles/css-3d-lab-shapes/cover/render.mjs
     (#medium = 1500x750, #linkedin = 1920x1080). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
@font-face { font-family: 'DM Sans'; font-weight: 100 1000; src: url(../../../docs/assets/fonts/dm-sans-latin.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', system-ui, sans-serif; color: #eceefb; position: relative;
  background:
    radial-gradient(60% 70% at 0% 0%, rgb(139 108 255 / 22%), transparent 70%),
    radial-gradient(40% 50% at 75% 100%, rgb(255 77 157 / 10%), transparent 70%),
    #0b0d18;
}
body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / 9%) 1px, transparent 1.2px); background-size: 20px 20px; }
.copy { position: absolute; z-index: 1; }
.cube { display: block; }
.kicker { font-family: Consolas, 'Cascadia Mono', ui-monospace, monospace; font-weight: 700; color: #2ee6d6; text-transform: uppercase; }
h1 { font-weight: 700; line-height: 1.06; color: #f3f4fb; white-space: nowrap; }
h1 .grad { background: linear-gradient(90deg, #8b6cff, #ff4d9d 55%, #ffb547); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: #b8bbd6; line-height: 1.35; }


.grid { position: absolute; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { position: relative; border: 1px solid #272b48; border-radius: 14px; overflow: hidden; background: #05060c; box-shadow: 0 30px 70px -30px rgb(0 0 0 / 70%); }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile span { position: absolute; left: 14px; bottom: 11px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #c9cce6; }

/* Medium, 1500 x 750 */
.medium .copy { left: 90px; top: 196px; width: 640px; }
.medium .cube { width: 86px; height: 86px; }
.medium .kicker { font-size: 18px; letter-spacing: .24em; margin-top: 24px; }
.medium h1 { font-size: 56px; letter-spacing: -0.035em; margin-top: 22px; }
.medium .sub { font-size: 25px; margin-top: 22px; max-width: 560px; }
.medium .grid { left: 790px; top: 95px; width: 620px; }
.medium .tile { height: 270px; }

/* LinkedIn, 1920 x 1080 */
.linkedin .copy { left: 130px; top: 300px; width: 860px; }
.linkedin .cube { width: 112px; height: 112px; }
.linkedin .kicker { font-size: 23px; letter-spacing: .24em; margin-top: 30px; }
.linkedin h1 { font-size: 74px; letter-spacing: -0.035em; margin-top: 26px; }
.linkedin .sub { font-size: 32px; margin-top: 28px; max-width: 740px; }
.linkedin .grid { left: 1020px; top: 150px; width: 780px; gap: 18px; }
.linkedin .tile { height: 375px; }
.linkedin .tile span { font-size: 16px; }
</style>
</head>
<body>
<div class="copy">
  <svg class="cube" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bfaf1"/><stop offset="1" stop-color="#2ee6d6"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#a58cff"/><stop offset="1" stop-color="#5b3be8"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ff86bd"/><stop offset="1" stop-color="#d81e74"/></linearGradient>
  </defs><polygon points="256.0,16.0 463.8,136.0 256.0,256.0 48.2,136.0" fill="url(#t)" fill-opacity="0.92" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="48.2,136.0 256.0,256.0 256.0,496.0 48.2,376.0" fill="url(#l)" fill-opacity="0.9" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="256.0,256.0 463.8,136.0 463.8,376.0 256.0,496.0" fill="url(#r)" fill-opacity="0.9" stroke="#fff" stroke-opacity="0.55" stroke-width="7" stroke-linejoin="round"/></svg>
  <p class="kicker">CSS 3D Lab · Shapes &amp; solids</p>
  <h1>Every solid in CSS<br><span class="grad">is made of paper</span></h1>
  <p class="sub">30 shapes, and the tricks that keep flat elements from vanishing edge-on.</p>
</div>

<div class="grid" aria-hidden="true">
  <div class="tile"><img src="../coin-1400.png" alt=""><span>Coin</span></div>
  <div class="tile"><img src="../rubik-1400.png" alt=""><span>Puzzle cube</span></div>
  <div class="tile"><img src="../torus-1400.png" alt=""><span>Torus</span></div>
  <div class="tile"><img src="../gear-1400.png" alt=""><span>Gears</span></div>
</div>
<script>document.body.className = location.hash === '#linkedin' ? 'linkedin' : 'medium';</script>
</body>
</html>
